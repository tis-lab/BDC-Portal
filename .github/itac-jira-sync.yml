name: ITAC Jira ID sync

# GitHub Actions has no trigger for Projects (v2) field changes, so this
# workflow reconciles on a schedule. It is idempotent: items whose fields are
# already correct produce no writes. repository_dispatch is provided so an
# org-level `projects_v2_item` webhook relay can trigger a single-item run
# for near-real-time updates.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      item_id:
        description: "Optional ProjectV2Item node ID (PVTI_...) to process only that item"
        required: false
        default: ""
      dry_run:
        description: "Log what would change without writing"
        type: boolean
        default: false
  repository_dispatch:
    types: [itac-jira-id-changed]   # client_payload: { "item_id": "PVTI_..." }

concurrency:
  group: itac-jira-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize ITAC Jira fields
        run: node .github/scripts/itac-jira-sync.mjs
        env:
          # GITHUB_TOKEN cannot access org projects. Use a classic PAT with the
          # `project` scope, a fine-grained PAT with org "Projects: read & write",
          # or a GitHub App installation token.
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: tis-lab
          PROJECT_NUMBER: "7"   # https://github.com/orgs/tis-lab/projects/7
          ITEM_ID: ${{ github.event.inputs.item_id || github.event.client_payload.item_id || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
