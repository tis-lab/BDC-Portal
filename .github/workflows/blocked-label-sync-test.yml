name: Blocked label sync TEST (temporary, delete before merge)
on:
  push:
    branches: [blocked-label-sync]
    paths: [.github/workflows/blocked-label-sync-test.yml]
permissions:
  issues: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node .github/scripts/blocked-label-sync.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DRY_RUN: "true"
          REPOS: >-
            tis-lab/BDC-Portal
            tis-lab/study-palette
