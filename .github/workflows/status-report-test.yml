name: Status report TEST (temporary, delete before merge)

# Runs the report script without committing or posting to Slack; the report is a run artifact.
on:
  push:
    branches: [add-status-reporting]
    paths:
      - .github/workflows/status-report-test.yml
      - .github/scripts/status-report.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node .github/scripts/status-report.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: tis-lab
          PROJECT_NUMBER: "7"
          SINCE_DAYS: "5"
          REPOS: >-
            tis-lab/BDC-Portal
            tis-lab/study-palette
      - run: cat Reporting/reports/*.md
      - uses: actions/upload-artifact@v4
        with:
          name: status-report-test
          path: Reporting/reports/*.md
