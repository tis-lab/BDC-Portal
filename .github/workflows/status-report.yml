name: Status report

# Generates Reporting/reports/<date>.md from GitHub activity and posts blockers to Slack.
# See Reporting/README.md.

on:
  schedule:
    # Tuesday 9am PT. GitHub often starts scheduled runs late (sometimes by hours), so there are
    # several slots (16:07-20:07 UTC covers 9am-1pm PDT/PST). The first slot that passes the
    # "Check Pacific time" step runs the report; later slots see today's report exists and skip.
    - cron: "7 16,17,18,19,20 * * 2"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Days of activity to include"
        required: false
        default: "7"

concurrency:
  group: status-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Pacific time and whether today's report exists
        id: gate
        run: |
          dow=$(TZ=America/Los_Angeles date +%u); hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$dow" = 2 ] && [ "$hour" -ge 9 ] && [ "$hour" -le 14 ] && [ ! -e "Reporting/reports/$(date -u +%F).md" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping (dow=$dow hour=$hour, or today's report already exists)"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build report
        if: steps.gate.outputs.run == 'true'
        run: node .github/scripts/status-report.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}   # reads the board Sprint field
          ORG: tis-lab
          PROJECT_NUMBER: "7"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '7' }}
          REPOS: >-
            tis-lab/BDC-Portal
            tis-lab/study-palette

      - name: Commit report
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Reporting/reports
          git diff --cached --quiet && exit 0
          git commit -m "Status report $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
