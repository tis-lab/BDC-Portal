name: Status report

# Generates Reporting/reports/<date>.md from GitHub activity and posts blockers to Slack.
# See Reporting/README.md.

on:
  schedule:
    - cron: "0 13 * * 1,4"   # Mon and Thu, 13:00 UTC (9am ET). Cadence is TBD in the SOP.
  workflow_dispatch:
    inputs:
      since_days:
        description: "Days of activity to include"
        required: false
        default: "4"

concurrency:
  group: status-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build report
        run: node .github/scripts/status-report.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '4' }}
          REPOS: >-
            tis-lab/BDC-Portal
            tis-lab/study-palette
            tis-lab/bdc-dp-core
            tis-lab/bdc-dp-middleware

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Reporting/reports
          git diff --cached --quiet && exit 0
          git commit -m "Status report $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
