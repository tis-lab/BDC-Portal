name: Status report Slack TEST (temporary, delete before merge)
on:
  push:
    branches: [cleaner-slack-message]
    paths: [.github/workflows/status-report-slack-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node .github/scripts/status-report.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: tis-lab/BDC-Portal
          ORG: tis-lab
          PROJECT_NUMBER: "7"
          SINCE_DAYS: "7"
          REPOS: >-
            tis-lab/BDC-Portal
            tis-lab/study-palette
